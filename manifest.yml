modules:
  webtrigger:
    - key: paystack-webhook
      function: webhook-fn
      response:
        type: dynamic
  consumer:
    - key: dispute-events-consumer
      queue: dispute-events
      function: consume-fn
  scheduledTrigger:
    - key: deadline-sweep
      function: sweep-fn
      interval: fiveMinute
  jira:adminPage:
    - key: disputedesk-admin
      title: DisputeDesk
      resource: admin-ui
      resolver:
        function: admin-fn
      render: native
      useAsConfig: true
  jira:issueContext:
    - key: dispute-context
      title: DisputeDesk
      label: Dispute deadline and evidence
      resource: issue-panel-ui
      resolver:
        function: issue-panel-fn
      render: native
      displayConditions:
        entityPropertyExists:
          entity: issue
          propertyKey: disputedesk
  jira:globalPage:
    - key: disputedesk-dashboard
      title: DisputeDesk
      resource: dashboard-ui
      resolver:
        function: dashboard-fn
      render: native
  rovo:agent:
    - key: dispute-analyst
      name: Dispute analyst
      prompt: >
        You help support and finance teams at online merchants handle payment
        disputes (chargebacks and fraud claims) that DisputeDesk tracks as Jira
        tickets. Paystack expects a response within 16 hours; after that it
        accepts the dispute for the merchant and refunds the customer from the
        merchant's balance. Explain what a dispute needs, which evidence fits
        its reason (proof of delivery, receipts, customer communication, refund
        records), and how close the deadline is. You draft; a person reviews and
        submits. Never claim you have submitted evidence or contacted Paystack.
      conversationStarters:
        - What evidence do I need for a chargeback?
        - What happens if we miss the Paystack deadline?
        - How should I answer a fraud claim?
  function:
    - key: webhook-fn
      handler: index.webhook
    - key: consume-fn
      handler: index.consume
      timeoutSeconds: 120
    - key: sweep-fn
      handler: index.sweep
      timeoutSeconds: 120
    - key: admin-fn
      handler: index.adminResolver
    - key: issue-panel-fn
      handler: index.issuePanelResolver
    - key: dashboard-fn
      handler: index.dashboardResolver
resources:
  - key: admin-ui
    path: src/frontend/admin.tsx
  - key: issue-panel-ui
    path: src/frontend/issue-panel.tsx
  - key: dashboard-ui
    path: src/frontend/dashboard.tsx
app:
  id: ari:cloud:ecosystem::app/6ee2aed7-5ef0-4e3b-87de-cbcd3b095db7
  runtime:
    name: nodejs24.x
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
  external:
    fetch:
      backend:
        # The admin simulator posts a signed test event to the app's own web trigger URL.
        - address: https://*.hello.atlassian-dev.net
          inScopeEUD: false
        # Paystack Dispute API, and the S3 signed URLs it returns for evidence uploads.
        - address: https://api.paystack.co
          inScopeEUD: true
        - address: https://s3.eu-west-1.amazonaws.com
          inScopeEUD: true
